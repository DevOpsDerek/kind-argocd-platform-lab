apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-components
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOpsDerek/kind-argocd-platform-lab.git
    targetRevision: main
    path: gitops/platform/base
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
